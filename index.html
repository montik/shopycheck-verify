<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Shopycheck LP Review</title>
<style>body{font-family:system-ui;margin:2rem;color:#222} .err{color:#b00}</style>
</head><body>
<p id="s">Loading full LP review…</p>
<script>
async function inflate(b64){
  const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  if (window.DecompressionStream){
    const ds=new DecompressionStream('gzip');
    const stream=new Blob([bin]).stream().pipeThrough(ds);
    return await new Response(stream).text();
  }
  throw new Error('gzip not supported');
}
(async()=>{
  try{
    const parts=[];
    for(let i=0;i<5;i++){
      const r=await fetch('chunk'+i+'.txt');
      if(!r.ok) throw new Error('chunk'+i+' HTTP '+r.status);
      parts.push(await r.text());
    }
    const html=await inflate(parts.join('').trim());
    document.open(); document.write(html); document.close();
  }catch(e){ document.getElementById('s').className='err'; document.getElementById('s').textContent='Load failed: '+e.message; }
})();
</script>
</body></html>
