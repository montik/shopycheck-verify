<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Shopycheck — Manual Verify</title></head>
<body style="margin:0;font-family:system-ui;background:#0b1220;color:#e8eef8"><p style="padding:24px">Loading…</p>
<script type="module">
const b64 = await (await fetch('page.html.gz.b64')).text();
const bin = Uint8Array.from(atob(b64.trim()), c => c.charCodeAt(0));
const ds = new DecompressionStream('gzip');
const stream = new Blob([bin]).stream().pipeThrough(ds);
const html = await new Response(stream).text();
document.open(); document.write(html); document.close();
</script></body></html>
